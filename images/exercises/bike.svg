    .shoe { fill: #dfe6f0; }
    .metal, .metal-fill { fill: #aeb8c6; stroke: #d5deea; }
    .metal-hi { fill: #eef3f8; }
    .kb-fill { fill: #c5ced8; stroke: #eef3f8; }
