<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e13" />
  <meta name="color-scheme" content="dark light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitTrack" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Track daily calories, protein, and workouts on your iPhone." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <title>FitTrack</title>
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="icons/icon-192.png" alt="" width="28" height="28" />
        <span class="brand-name">FitTrack</span>
      </div>
    </header>
    <main id="main" class="main"></main>
    <nav class="tabbar" role="tablist" aria-label="Main">
      <button type="button" class="tab" role="tab" data-act="tab" data-tab="today" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5Z"/></svg>
        <span>Today</span>
      </button>
      <button type="button" class="tab" role="tab" data-act="tab" data-tab="workouts" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.5h1.8v7H2v-7Zm2.4-2h2.2v11H4.4V6.5ZM8 10h8v4H8v-4Zm9.4-3.5h2.2v11h-2.2V6.5Zm3 2H22v7h-1.6v-7Z"/></svg>
        <span>Workouts</span>
      </button>
      <button type="button" class="tab" role="tab" data-act="tab" data-tab="history" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9h3v10H5Zm5.5 0V5h3v14h-3ZM16 19v-7h3v7h-3Z"/></svg>
        <span>History</span>
      </button>
      <button type="button" class="tab" role="tab" data-act="tab" data-tab="weight" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5 9.2 11l3.1 3.2L19 7.2l1.6 1.5-8.2 8.8-3.2-3.3L5.5 18 4 16.5Z"/></svg>
        <span>Weight</span>
      </button>
      <button type="button" class="tab" role="tab" data-act="tab" data-tab="settings" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.2 3.2h3.6l.4 2.1a6.8 6.8 0 0 1 1.6.9l2-1.1 1.8 3.1-1.7 1.3c.1.5.2 1 .2 1.5s0 1-.2 1.5l1.7 1.3-1.8 3.1-2-1.1a6.8 6.8 0 0 1-1.6.9l-.4 2.1h-3.6l-.4-2.1a6.8 6.8 0 0 1-1.6-.9l-2 1.1-1.8-3.1 1.7-1.3a6.9 6.9 0 0 1-.2-1.5c0-.5.1-1 .2-1.5L4.4 8.2 6.2 5.1l2 1.1a6.8 6.8 0 0 1 1.6-.9l.4-2.1ZM12 9.3A2.7 2.7 0 1 0 12 14.7 2.7 2.7 0 0 0 12 9.3Z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" hidden role="status"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden />
  <script src="app.js?v=10"></script>
</body>
</html>
